name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            # The browser tests use the runner's Chrome.
            - run: bun test
            # Validates addon.jsonc and bundles the function, without deploying.
            - run: bun run check
